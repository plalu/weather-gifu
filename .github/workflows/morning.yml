name: morning-weather

on:
  schedule:
    - cron: '45 19 * * *'
    - cron: '00 20 * * *'
    - cron: '15 20 * * *'
    - cron: '45 20 * * *'
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate WAV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          JMA_FRESHNESS_RETRIES: 30
          JMA_FRESHNESS_WAIT_SECONDS: 60
          JMA_HTTP_RETRIES: 4
          JMA_HTTP_WAIT_SECONDS: 60
          OUTPUT_PATH: today.wav
          TZ: Asia/Tokyo
        run: python main.py

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Tokyo
        run: |
          if gh release view today >/dev/null 2>&1; then
            gh release upload today today.wav --clobber
            gh release edit today \
              --title "today" \
              --notes "Generated $(date -Iseconds)"
          else
            gh release create today today.wav \
              --title "today" \
              --notes "Generated $(date -Iseconds)"
          fi
